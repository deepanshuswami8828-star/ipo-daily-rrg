# Daily data refresh: after the NSE close, download the latest prices for every stock and NIFTY 50,
# recalculate the saved results (data/results.pkl.gz) once, and push. Streamlit Cloud redeploys on the push,
# so the app always opens with fresh data and nothing heavy to calculate.
name: Daily data refresh

on:
  schedule:
    # GitHub can delay or skip scheduled runs (most often at :00 / :30), so several odd-minute runs each
    # weekday evening: the first that finds the new session saves it, the later ones see no change and stop.
    - cron: "22 12 * * 1-5"      # 17:52 IST, Monday-Friday (after the NSE close)
    - cron: "52 13 * * 1-5"      # 19:22 IST
    - cron: "22 15 * * 1-5"      # 20:52 IST
    - cron: "22 17 * * 1-5"      # 22:52 IST
  workflow_dispatch:              # "Run workflow" button on GitHub

permissions:
  contents: write                # to commit the refreshed data and results

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Download prices and rebuild saved results
        id: build
        run: python build_cache.py --refresh
      - name: Save new data and results
        run: |
          if [ "${{ steps.build.outputs.changed }}" != "true" ]; then
            echo "No new session and no code change; nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data refresh: prices up to ${{ steps.build.outputs.last }}"
          git push
